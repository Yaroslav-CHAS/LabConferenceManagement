<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Управление конференцией</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #36454F; color: white; padding: 24px; }
    header h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; opacity: .9; }
    main { width: 100%; margin: 16px auto; padding: 0 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-areas: "section person direction conference" "program program program program";
      gap: 16px;
      align-items: start;
    }
    section { min-width: 0; background: white; border-radius: 8px; padding: 18px; box-shadow: 0 1px 3px #0002; }
    .person-card { grid-area: person; }
    .conference-card { grid-area: conference; }
    .direction-card { grid-area: direction; }
    .section-card { grid-area: section; }
    .program-card { grid-area: program; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    form { display: grid; gap: 9px; }
    label { display: grid; min-width: 0; gap: 4px; font-size: 14px; }
    input, textarea, select, button { width: 100%; min-width: 0; font: inherit; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; }
    textarea { min-height: 62px; resize: vertical; }
    button { cursor: pointer; background: #2563eb; color: white; border: 0; margin-top: 4px; }
    button:hover { background: #1d4ed8; }
    .list { display: grid; gap: 8px; }
    .item { border-left: 4px solid #2563eb; background: #eff6ff; padding: 9px; border-radius: 4px; }
    .muted { color: #64748b; font-size: 14px; }
    #message { min-height: 24px; margin-bottom: 14px; font-weight: 600; }
    #message:empty { display: none; }
    .success { color: #15803d; }
    .error { color: #b91c1c; }
    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas: "section person" "direction conference" "program program";
      }
    }
    @media (max-width: 720px) {
      header { padding: 20px; }
      main { margin: 16px auto; padding: 0 12px; }
      .grid {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "section" "person" "direction" "conference" "program";
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Управление секциями конференции</h1>
  </header>
  <main>
    <div id="message" aria-live="polite"></div>
    <div class="grid">
      <section class="section-card">
        <h2>Добавить секцию</h2>
        <form id="section-form">
          <label>Направление <select name="scientificDirectionId" id="direction-select" required></select></label>
          <label>Председатель <select name="chairmanId" id="chairman-select" required></select></label>
          <label>Секретарь <select name="secretaryId" id="secretary-select"></select></label>
          <label>Название <input name="name" required></label>
          <label>Индекс <input name="index" required></label>
          <label>Описание <textarea name="description"></textarea></label>
          <label>Место <input name="place" required></label>
          <label>Начало <input name="startTime" type="datetime-local" required></label>
          <label>Окончание <input name="endTime" type="datetime-local" required></label>
          <button>Сохранить секцию</button>
        </form>
      </section>

      <section class="person-card">
        <h2>Добавить ответственное лицо</h2>
        <form id="person-form">
          <label>Фамилия <input name="lastName" required></label>
          <label>Имя <input name="firstName" required></label>
          <label>Отчество <input name="middleName"></label>
          <label>Место работы <input name="workplace"></label>
          <label>Email <input name="email" type="email" required></label>
          <label>Телефон <input name="phone"></label>
          <button>Сохранить человека</button>
        </form>
      </section>

      <section class="direction-card">
        <h2>Добавить направление</h2>
        <form id="direction-form">
          <label>Конференция <select name="conferenceId" id="conference-select" required></select></label>
          <label>Название <input name="name" required></label>
          <label>Индекс <input name="index" required></label>
          <label>Описание <textarea name="description"></textarea></label>
          <button>Сохранить направление</button>
        </form>
      </section>

      <section class="conference-card">
        <h2>Добавить конференцию</h2>
        <form id="conference-form">
          <label>Название <input name="name" required></label>
          <label>Дата начала <input name="startDate" type="date" required></label>
          <label>Дата окончания <input name="endDate" type="date" required></label>
          <button>Сохранить конференцию</button>
        </form>
      </section>

      <section class="program-card">
        <h2>Текущая программа</h2>
        <div id="sections-list" class="list"><span class="muted">Загрузка данных...</span></div>
      </section>
    </div>
  </main>
  <script>
    const message = document.getElementById('message');
    const api = async (url, options) => {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(await response.text() || 'Ошибка запроса');
      return response.status === 204 ? null : response.json();
    };
    const setMessage = (text, isError = false) => {
      message.textContent = text;
      message.className = isError ? 'error' : 'success';
    };
    const formData = form => Object.fromEntries(new FormData(form).entries());
    const post = (url, body) => api(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const option = (value, text) => `<option value="${value}">${text}</option>`;

    async function refresh() {
      const [persons, conferences, directions, sections] = await Promise.all([
        api('/api/Persons'), api('/api/Conferences'), api('/api/ScientificDirections'), api('/api/Sections')
      ]);
      document.getElementById('conference-select').innerHTML = conferences.length
        ? conferences.map(x => option(x.id, x.name)).join('') : '<option value="">Сначала создайте конференцию</option>';
      document.getElementById('direction-select').innerHTML = directions.length
        ? directions.map(x => option(x.id, `${x.index} - ${x.name}`)).join('') : '<option value="">Сначала создайте направление</option>';
      const people = persons.map(x => option(x.id, `${x.lastName} ${x.firstName}`)).join('');
      document.getElementById('chairman-select').innerHTML = people || '<option value="">Сначала добавьте человека</option>';
      document.getElementById('secretary-select').innerHTML = '<option value="">Не назначен</option>' + people;
      const list = document.getElementById('sections-list');
      list.innerHTML = sections.length ? sections.map(x => `
        <div class="item"><strong>${x.index}: ${x.name}</strong><br>
        ${x.place}, ${new Date(x.startTime).toLocaleString('ru-RU')} - ${new Date(x.endTime).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}<br>
        <span class="muted">Председатель: ${x.chairman ? `${x.chairman.lastName} ${x.chairman.firstName}` : 'не назначен'}</span></div>`).join('')
        : '<span class="muted">Секций пока нет.</span>';
    }

    document.getElementById('person-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { await post('/api/Persons', formData(event.target)); event.target.reset(); setMessage('Человек сохранён.'); await refresh(); }
      catch (error) { setMessage(error.message, true); }
    });
    document.getElementById('conference-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { const data = formData(event.target); data.startDate += 'T00:00:00'; data.endDate += 'T00:00:00'; data.directions = []; await post('/api/Conferences', data); event.target.reset(); setMessage('Конференция сохранена.'); await refresh(); }
      catch (error) { setMessage(error.message, true); }
    });
    document.getElementById('direction-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { const data = formData(event.target); data.sections = []; await post('/api/ScientificDirections', data); event.target.reset(); setMessage('Направление сохранено.'); await refresh(); }
      catch (error) { setMessage(error.message, true); }
    });
    document.getElementById('section-form').addEventListener('submit', async event => {
      event.preventDefault();
      try { const data = formData(event.target); data.startTime += ':00'; data.endTime += ':00'; data.secretaryId = data.secretaryId || null; await post('/api/Sections', data); event.target.reset(); setMessage('Секция сохранена.'); await refresh(); }
      catch (error) { setMessage(error.message, true); }
    });
    refresh().catch(error => setMessage(error.message, true));
  </script>
</body>
</html>
